<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join RAMix Game</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #1A1A2E;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
      box-sizing: border-box;
    }
    h1 {
      font-size: 42px;
      margin: 0 0 8px;
      background: linear-gradient(90deg, #FF6B6B, #4ECDC4, #FFE66D, #6C5CE7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 4px;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      margin-bottom: 40px;
    }
    .code-box {
      background: rgba(255,255,255,0.05);
      border: 2px solid #4ECDC4;
      border-radius: 16px;
      padding: 20px 32px;
      margin: 24px 0;
    }
    .code-label {
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .code {
      font-size: 40px;
      font-weight: bold;
      color: #4ECDC4;
      letter-spacing: 8px;
      font-family: 'Courier New', monospace;
    }
    .button {
      display: inline-block;
      background: #4ECDC4;
      color: #000;
      padding: 16px 32px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin: 8px;
      border: none;
      cursor: pointer;
    }
    .button.secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }
    .info {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      margin-top: 24px;
      max-width: 400px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>RAMIX</h1>
  <div class="subtitle">Color Sort Puzzle Game</div>

  <div class="code-box">
    <div class="code-label">ROOM CODE</div>
    <div class="code" id="code">------</div>
  </div>

  <a id="openApp" href="#" class="button">Open in RAMix</a>
  <a href="https://apps.apple.com/app/ramix" class="button secondary">Download RAMix</a>

  <div class="info">
    If you have RAMix installed, tap "Open in RAMix" to join the room.<br>
    Otherwise, download it from the App Store and enter the code above.
  </div>

  <script>
    // Extract ?code=XXX from URL
    const params = new URLSearchParams(window.location.search);
    const code = (params.get('code') || '').toUpperCase();
    document.getElementById('code').textContent = code || '------';

    const deepLink = 'ramix://join?code=' + encodeURIComponent(code);
    document.getElementById('openApp').href = deepLink;

    // Auto-redirect to app (if installed) on page load
    if (code) {
      setTimeout(function() {
        window.location.href = deepLink;
      }, 100);
    }
  </script>
</body>
</html>
